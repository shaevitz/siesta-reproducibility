[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siesta-reproducibility"
version = "0.1.0"
description = "Reproducibility utilities for VLM-supervised fly pose estimation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
  {name = "Joshua W. Shaevitz"},
  {name = "Matthew G. Sierra"},
  {name = "Sarah Kuo Kim"},
  {name = "Scott D. Pletcher"},
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
sleap = ["sleap-io==0.6.4", "pillow>=10"]
test = ["pytest>=8"]

[project.scripts]
siesta-repro = "siesta_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
